<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Drone Telemetry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        serif: ['Instrument Serif', 'Georgia', 'serif'],
                    },
                },
            },
        }
    </script>
</head>
<body class="font-sans antialiased min-h-screen flex items-center justify-center" style="background: radial-gradient(ellipse at 50% 0%, #1c1c20 0%, #09090b 70%);">

    <div class="w-full max-w-[400px] p-8">
        <div class="mb-8">
            <h1 class="font-serif text-2xl text-white tracking-tight">Drone Telemetry</h1>
            <p class="text-stone-500 text-xs tracking-[0.15em] uppercase mt-1">Criar Conta</p>
        </div>

        <div id="register-msg" class="text-sm mb-4 min-h-[20px]"></div>

        <input type="text" id="reg-user" placeholder="Usuario" autocomplete="username"
            class="w-full px-4 py-3 mb-3 rounded-xl bg-white/[0.06] border border-white/[0.08] text-stone-200 text-sm placeholder-stone-500 focus:outline-none focus:border-stone-400/40 focus:ring-1 focus:ring-stone-400/20 transition">
        <input type="password" id="reg-pass" placeholder="Senha" autocomplete="new-password"
            class="w-full px-4 py-3 mb-3 rounded-xl bg-white/[0.06] border border-white/[0.08] text-stone-200 text-sm placeholder-stone-500 focus:outline-none focus:border-stone-400/40 focus:ring-1 focus:ring-stone-400/20 transition">
        <input type="password" id="reg-pass-confirm" placeholder="Confirmar senha" autocomplete="new-password"
            class="w-full px-4 py-3 mb-5 rounded-xl bg-white/[0.06] border border-white/[0.08] text-stone-200 text-sm placeholder-stone-500 focus:outline-none focus:border-stone-400/40 focus:ring-1 focus:ring-stone-400/20 transition">

        <button id="btn-submit"
            class="w-full py-3.5 rounded-xl bg-white text-zinc-900 font-semibold text-sm hover:bg-stone-100 active:scale-[0.98] transition-all cursor-pointer">
            Criar conta
        </button>
        <button id="btn-back"
            class="w-full py-3.5 mt-3 rounded-xl bg-white/[0.06] border border-white/[0.08] text-stone-400 text-sm font-medium hover:bg-white/[0.1] hover:text-stone-200 transition-all cursor-pointer">
            Voltar ao login
        </button>
    </div>

    <script>
        document.getElementById('btn-back').addEventListener('click', function() {
            window.location.href = '/';
        });

        document.getElementById('btn-submit').addEventListener('click', async function() {
            var user = document.getElementById('reg-user').value.trim();
            var pass = document.getElementById('reg-pass').value;
            var confirm = document.getElementById('reg-pass-confirm').value;
            var msg = document.getElementById('register-msg');

            msg.className = 'text-sm mb-4 min-h-[20px]';
            if (!user || !pass) {
                msg.classList.add('text-red-400');
                msg.textContent = 'Preencha usuario e senha';
                return;
            }
            if (pass !== confirm) {
                msg.classList.add('text-red-400');
                msg.textContent = 'As senhas nao coincidem';
                return;
            }
            if (pass.length < 4) {
                msg.classList.add('text-red-400');
                msg.textContent = 'Senha deve ter pelo menos 4 caracteres';
                return;
            }

            var resp = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: user, password: pass}),
            });

            if (resp.ok) {
                msg.classList.add('text-emerald-400');
                msg.textContent = 'Conta criada! Redirecionando...';
                setTimeout(function() { window.location.href = '/'; }, 1500);
            } else {
                var data = await resp.json();
                msg.classList.add('text-red-400');
                msg.textContent = data.error || 'Erro ao criar conta';
            }
        });

        document.querySelectorAll('input').forEach(function(input) {
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') document.getElementById('btn-submit').click();
            });
        });
    </script>
</body>
</html>
