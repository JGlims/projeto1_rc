<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Telemetry Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        neon: { cyan: '#00e5ff', green: '#06ffa5', red: '#ff3b5c', amber: '#ffb300' },
                        surface: { base: '#070b14', raised: '#0d1424', overlay: '#131c32' },
                    },
                },
            },
        }
    </script>
    <style>
        .glass {
            background: rgba(13, 20, 36, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .glass-strong {
            background: rgba(19, 28, 50, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .value-transition { transition: color 0.3s ease, opacity 0.15s ease; }
        .pulse-dot {
            width: 8px; height: 8px; border-radius: 50%;
            animation: pulse-glow 2s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; box-shadow: 0 0 4px currentColor; }
            50% { opacity: 0.5; box-shadow: 0 0 12px currentColor; }
        }
        .card-hover { transition: border-color 0.25s ease, box-shadow 0.25s ease; }
        .card-hover:hover {
            border-color: rgba(0, 229, 255, 0.3);
            box-shadow: 0 0 24px rgba(0, 229, 255, 0.06);
        }
        .btn-cmd {
            transition: all 0.2s ease;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        .btn-cmd:active { transform: scale(0.96); }
    </style>
</head>
<body class="bg-surface-base font-sans text-gray-200 min-h-screen antialiased">

    <div id="login-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm">
        <div class="glass-strong rounded-2xl p-8 w-[380px] shadow-2xl">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 rounded-xl bg-neon-cyan/10 flex items-center justify-center">
                    <svg class="w-5 h-5 text-neon-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                </div>
                <div>
                    <h2 class="text-lg font-bold text-white">Login</h2>
                    <p class="text-xs text-gray-400">Acesse o painel de telemetria</p>
                </div>
            </div>
            <div id="login-msg" class="text-sm mb-3 min-h-[20px]"></div>
            <input type="text" id="login-user" placeholder="Usuario" autocomplete="username"
                class="w-full px-4 py-3 mb-3 rounded-lg bg-surface-base/80 border border-white/10 text-gray-200 text-sm placeholder-gray-500 focus:outline-none focus:border-neon-cyan/50 focus:ring-1 focus:ring-neon-cyan/20 transition">
            <input type="password" id="login-pass" placeholder="Senha" autocomplete="current-password"
                class="w-full px-4 py-3 mb-4 rounded-lg bg-surface-base/80 border border-white/10 text-gray-200 text-sm placeholder-gray-500 focus:outline-none focus:border-neon-cyan/50 focus:ring-1 focus:ring-neon-cyan/20 transition">
            <button id="btn-login"
                class="w-full py-3 rounded-lg bg-neon-cyan text-surface-base font-bold text-sm hover:brightness-110 transition cursor-pointer">
                Entrar
            </button>
            <button id="btn-register"
                class="w-full py-3 mt-2 rounded-lg bg-white/5 border border-white/10 text-gray-300 text-sm font-medium hover:bg-white/10 transition cursor-pointer">
                Criar conta
            </button>
        </div>
    </div>

    <header class="glass sticky top-0 z-40 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-neon-cyan/10 flex items-center justify-center">
                <svg class="w-5 h-5 text-neon-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/>
                </svg>
            </div>
            <div>
                <h1 class="text-base font-bold text-white tracking-tight">Drone Telemetry</h1>
                <p class="text-[11px] text-gray-500 font-medium uppercase tracking-wider">Ground Station Monitor</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div id="header-status" class="flex items-center gap-2 text-xs text-gray-400">
                <span class="pulse-dot bg-neon-green text-neon-green"></span>
                <span>Sistema ativo</span>
            </div>
            <button id="btn-logout" class="hidden text-xs text-gray-400 hover:text-white transition px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 cursor-pointer">
                Sair
            </button>
        </div>
    </header>

    <main class="max-w-[1400px] mx-auto px-6 py-6 space-y-6">
        <div id="no-drones" class="text-center py-20 text-gray-500">
            <svg class="w-12 h-12 mx-auto mb-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
            </svg>
            <p class="text-sm font-medium">Aguardando dados de telemetria...</p>
            <p class="text-xs text-gray-600 mt-1">Os drones conectados aparecerao aqui</p>
        </div>

        <div id="drone-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>

        <div id="metrics-panel" class="glass-strong rounded-xl p-5 hidden">
            <div class="flex items-center gap-2 mb-4">
                <svg class="w-4 h-4 text-neon-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                </svg>
                <h2 class="text-sm font-semibold text-white">Metricas de Rede</h2>
            </div>
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white/[0.03] rounded-lg p-3">
                    <p class="text-[10px] text-gray-500 uppercase tracking-wider mb-1">RTT Medio</p>
                    <p class="text-lg font-semibold text-white value-transition" id="m-rtt">--</p>
                </div>
                <div class="bg-white/[0.03] rounded-lg p-3">
                    <p class="text-[10px] text-gray-500 uppercase tracking-wider mb-1">Throughput UDP</p>
                    <p class="text-lg font-semibold text-white value-transition" id="m-throughput">--</p>
                </div>
                <div class="bg-white/[0.03] rounded-lg p-3">
                    <p class="text-[10px] text-gray-500 uppercase tracking-wider mb-1">Pacotes</p>
                    <p class="text-lg font-semibold text-white value-transition" id="m-packets">--</p>
                </div>
                <div class="bg-white/[0.03] rounded-lg p-3">
                    <p class="text-[10px] text-gray-500 uppercase tracking-wider mb-1">Bytes Totais</p>
                    <p class="text-lg font-semibold text-white value-transition" id="m-bytes">--</p>
                </div>
            </div>
        </div>

        <div id="alerts-container" class="space-y-2"></div>
    </main>

    <template id="drone-card-template">
        <div class="glass card-hover rounded-xl p-5">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-neon-cyan/10 flex items-center justify-center">
                        <svg class="w-4 h-4 text-neon-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                        </svg>
                    </div>
                    <h2 class="text-sm font-bold text-white tracking-tight" data-field="title"></h2>
                </div>
                <div class="flex items-center gap-2">
                    <span class="pulse-dot" data-status-dot></span>
                    <span class="text-xs font-semibold uppercase tracking-wider" data-field="status"></span>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-x-4 gap-y-2 mb-4">
                <div>
                    <p class="text-[10px] text-gray-500 uppercase tracking-wider">Latitude</p>
                    <p class="text-sm font-semibold text-gray-200 value-transition" data-field="lat"></p>
                </div>
                <div>
                    <p class="text-[10px] text-gray-500 uppercase tracking-wider">Longitude</p>
                    <p class="text-sm font-semibold text-gray-200 value-transition" data-field="lon"></p>
                </div>
                <div>
                    <p class="text-[10px] text-gray-500 uppercase tracking-wider">Altitude</p>
                    <p class="text-sm font-semibold text-gray-200 value-transition" data-field="alt"></p>
                </div>
                <div>
                    <p class="text-[10px] text-gray-500 uppercase tracking-wider">Velocidade</p>
                    <p class="text-sm font-semibold text-gray-200 value-transition" data-field="speed"></p>
                </div>
            </div>
            <div class="flex items-center justify-between mb-4 bg-white/[0.03] rounded-lg px-3 py-2">
                <span class="text-[10px] text-gray-500 uppercase tracking-wider">Bateria</span>
                <div class="flex items-center gap-2">
                    <div class="w-20 h-1.5 bg-white/10 rounded-full overflow-hidden">
                        <div class="h-full rounded-full transition-all duration-500" data-battery-bar></div>
                    </div>
                    <span class="text-sm font-bold value-transition" data-field="battery"></span>
                </div>
            </div>
            <div class="flex gap-2">
                <button class="btn-cmd flex-1 py-2 rounded-lg bg-neon-red/15 text-neon-red text-xs font-bold hover:bg-neon-red/25 cursor-pointer" data-cmd="LAND">LAND</button>
                <button class="btn-cmd flex-1 py-2 rounded-lg bg-neon-amber/15 text-neon-amber text-xs font-bold hover:bg-neon-amber/25 cursor-pointer" data-cmd="HOVER">HOVER</button>
                <button class="btn-cmd flex-1 py-2 rounded-lg bg-neon-cyan/15 text-neon-cyan text-xs font-bold hover:bg-neon-cyan/25 cursor-pointer" data-cmd="RTH">RTH</button>
            </div>
        </div>
    </template>

    <script>
        let authToken = null;

        document.getElementById('btn-login').addEventListener('click', async function() {
            const user = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            const msg = document.getElementById('login-msg');
            const resp = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: user, password: pass}),
            });
            if (resp.ok) {
                const data = await resp.json();
                authToken = data.token;
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('btn-logout').classList.remove('hidden');
                refresh();
                refreshMetrics();
            } else {
                msg.textContent = 'Usuario ou senha incorretos';
                msg.className = 'text-sm mb-3 min-h-[20px] text-neon-red';
            }
        });

        document.getElementById('login-user').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('login-pass').focus();
        });
        document.getElementById('login-pass').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('btn-login').click();
        });

        document.getElementById('btn-register').addEventListener('click', function() {
            window.location.href = '/register';
        });

        document.getElementById('btn-logout').addEventListener('click', function() {
            authToken = null;
            document.getElementById('login-overlay').style.display = 'flex';
            document.getElementById('btn-logout').classList.add('hidden');
            document.getElementById('login-user').value = '';
            document.getElementById('login-pass').value = '';
            document.getElementById('login-msg').textContent = '';
        });

        async function fetchJSON(url) {
            const resp = await fetch(url);
            return resp.json();
        }

        function statusColor(status) {
            switch ((status || '').toLowerCase()) {
                case 'flying': return 'text-neon-green';
                case 'hovering': return 'text-neon-amber';
                case 'landed': return 'text-gray-400';
                default: return 'text-gray-500';
            }
        }

        function statusDot(status) {
            switch ((status || '').toLowerCase()) {
                case 'flying': return 'bg-neon-green text-neon-green';
                case 'hovering': return 'bg-neon-amber text-neon-amber';
                case 'landed': return 'bg-gray-400 text-gray-400';
                default: return 'bg-gray-600 text-gray-600';
            }
        }

        function batteryColor(pct) {
            if (pct <= 15) return 'text-neon-red';
            if (pct <= 30) return 'text-neon-amber';
            return 'text-neon-green';
        }

        function buildDroneCard(droneId, d) {
            var tmpl = document.getElementById('drone-card-template');
            var card = tmpl.content.firstElementChild.cloneNode(true);
            card.setAttribute('data-drone-id', droneId);
            card.querySelector('[data-field="title"]').textContent = droneId;

            card.querySelectorAll('[data-cmd]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    sendCmd(droneId, btn.getAttribute('data-cmd'));
                });
            });

            updateCard(card, d);
            return card;
        }

        function updateCard(card, d) {
            var status = d.status || 'idle';
            var statusEl = card.querySelector('[data-field="status"]');
            statusEl.textContent = status;
            statusEl.className = 'text-xs font-semibold uppercase tracking-wider ' + statusColor(status);

            var dot = card.querySelector('[data-status-dot]');
            dot.className = 'pulse-dot ' + statusDot(status);

            card.querySelector('[data-field="lat"]').textContent = d.lat.toFixed(4);
            card.querySelector('[data-field="lon"]').textContent = d.lon.toFixed(4);
            card.querySelector('[data-field="alt"]').textContent = d.alt.toFixed(1) + ' m';
            card.querySelector('[data-field="speed"]').textContent = d.speed.toFixed(1) + ' m/s';

            var batteryEl = card.querySelector('[data-field="battery"]');
            batteryEl.textContent = d.battery.toFixed(1) + '%';
            batteryEl.className = 'text-sm font-bold value-transition ' + batteryColor(d.battery);

            var bar = card.querySelector('[data-battery-bar]');
            bar.style.width = Math.min(100, Math.max(0, d.battery)) + '%';
            if (d.battery <= 15) bar.className = 'h-full rounded-full transition-all duration-500 bg-neon-red';
            else if (d.battery <= 30) bar.className = 'h-full rounded-full transition-all duration-500 bg-neon-amber';
            else bar.className = 'h-full rounded-full transition-all duration-500 bg-neon-green';
        }

        async function sendCmd(droneId, type) {
            var headers = {'Content-Type': 'application/json'};
            if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
            var resp = await fetch('/api/drones/' + encodeURIComponent(droneId) + '/command', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({type: type}),
            });
            var data = await resp.json();
            if (!resp.ok) {
                console.error('Erro:', data.error);
            }
        }

        async function refresh() {
            var result = await fetchJSON('/api/drones');
            var drones = result.drones;
            var grid = document.getElementById('drone-grid');
            var noDrones = document.getElementById('no-drones');

            if (drones.length === 0) {
                noDrones.style.display = 'block';
                grid.querySelectorAll('[data-drone-id]').forEach(function(el) { el.remove(); });
                return;
            }
            noDrones.style.display = 'none';

            var activeDrones = new Set(drones);
            grid.querySelectorAll('[data-drone-id]').forEach(function(card) {
                if (!activeDrones.has(card.getAttribute('data-drone-id'))) {
                    card.remove();
                }
            });

            for (var i = 0; i < drones.length; i++) {
                var id = drones[i];
                var data = await fetchJSON('/api/drones/' + encodeURIComponent(id));
                var existing = grid.querySelector('[data-drone-id="' + id + '"]');
                if (existing) {
                    updateCard(existing, data.latest);
                } else {
                    grid.appendChild(buildDroneCard(id, data.latest));
                }
            }

            var alertResult = await fetchJSON('/api/alerts');
            var alerts = alertResult.alerts;
            var ac = document.getElementById('alerts-container');
            while (ac.firstChild) ac.removeChild(ac.firstChild);
            for (var j = 0; j < alerts.length; j++) {
                var a = alerts[j];
                var div = document.createElement('div');
                div.className = 'glass rounded-lg px-4 py-3 flex items-center gap-3 border-l-2 border-neon-red/60';

                var icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                icon.setAttribute('class', 'w-4 h-4 text-neon-red flex-shrink-0');
                icon.setAttribute('fill', 'none');
                icon.setAttribute('stroke', 'currentColor');
                icon.setAttribute('viewBox', '0 0 24 24');
                var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('stroke-linecap', 'round');
                path.setAttribute('stroke-linejoin', 'round');
                path.setAttribute('stroke-width', '2');
                path.setAttribute('d', 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z');
                icon.appendChild(path);
                div.appendChild(icon);

                var span = document.createElement('span');
                span.className = 'text-xs text-gray-300';
                span.textContent = a.drone_id + ' — ' + a.alert_type + ': ' + a.message;
                div.appendChild(span);

                ac.appendChild(div);
            }
        }

        async function refreshMetrics() {
            var data = await fetchJSON('/api/metrics');
            var panel = document.getElementById('metrics-panel');
            if (data.rtt || data.throughput) {
                panel.classList.remove('hidden');
            }
            if (data.rtt && data.rtt.average_sec !== null) {
                document.getElementById('m-rtt').textContent = (data.rtt.average_sec * 1000).toFixed(2) + ' ms';
            }
            if (data.throughput) {
                document.getElementById('m-throughput').textContent = (data.throughput.bytes_per_second / 1024).toFixed(2) + ' KB/s';
                document.getElementById('m-packets').textContent = data.throughput.packet_count;
                document.getElementById('m-bytes').textContent = data.throughput.total_bytes;
            }
        }

        refresh();
        refreshMetrics();
        setInterval(refresh, 2000);
        setInterval(refreshMetrics, 3000);
    </script>
</body>
</html>
