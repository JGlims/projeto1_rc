<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Telemetry Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0e17; color: #e0e0e0; }
        header { background: #111827; padding: 16px 24px; border-bottom: 1px solid #1e293b; }
        header h1 { font-size: 20px; color: #38bdf8; }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }

        .card {
            background: #1e293b; border-radius: 8px; padding: 20px;
            border: 1px solid #334155; transition: border-color 0.2s;
        }
        .card:hover { border-color: #38bdf8; }
        .card h2 { font-size: 16px; color: #38bdf8; margin-bottom: 12px; }
        .card .field { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
        .card .field .label { color: #94a3b8; }
        .card .field .value { font-weight: 600; }

        .status-flying { color: #4ade80; }
        .status-hovering { color: #facc15; }
        .status-landed { color: #94a3b8; }
        .status-idle { color: #94a3b8; }

        .btn {
            margin-top: 12px; padding: 8px 16px; border: none; border-radius: 6px;
            cursor: pointer; font-size: 13px; font-weight: 600;
        }
        .btn-land { background: #ef4444; color: white; }
        .btn-hover { background: #f59e0b; color: white; }
        .btn-rth { background: #3b82f6; color: white; }
        .btn:hover { opacity: 0.85; }
        .commands { display: flex; gap: 8px; margin-top: 12px; }

        .alerts { margin-top: 24px; }
        .alert-item {
            background: #7f1d1d; border: 1px solid #991b1b; border-radius: 6px;
            padding: 10px 16px; margin-bottom: 8px; font-size: 13px;
        }

        #no-drones { text-align: center; padding: 60px; color: #64748b; font-size: 16px; }

        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }
        #login-box { background: #1e293b; padding: 32px; border-radius: 12px; width: 340px; border: 1px solid #334155; }
        #login-box h2 { color: #38bdf8; margin-bottom: 20px; font-size: 18px; }
        #login-box input {
            width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 6px;
            border: 1px solid #334155; background: #0f172a; color: #e0e0e0; font-size: 14px;
        }
        #login-box .btn-login { width: 100%; background: #38bdf8; color: #0a0e17; padding: 10px; font-weight: 700; }
        #login-box .btn-register { width: 100%; background: #334155; color: #e0e0e0; padding: 10px; margin-top: 8px; }
        #login-msg { color: #ef4444; font-size: 13px; margin-bottom: 8px; min-height: 18px; }
    </style>
</head>
<body>
    <div id="login-overlay">
        <div id="login-box">
            <h2>Login</h2>
            <div id="login-msg"></div>
            <input type="text" id="login-user" placeholder="Usuario">
            <input type="password" id="login-pass" placeholder="Senha">
            <button class="btn btn-login" id="btn-login">Entrar</button>
            <button class="btn btn-register" id="btn-register">Criar conta</button>
        </div>
    </div>
    <header>
        <h1>Drone Telemetry Monitor</h1>
    </header>
    <div class="container">
        <div id="no-drones">Aguardando dados de telemetria...</div>
        <div id="drone-grid" class="grid"></div>
        <div id="metrics-panel" class="card" style="margin-top:24px; display:none;">
            <h2>Metricas de Rede</h2>
            <div class="field"><span class="label">RTT medio</span><span class="value" id="m-rtt">--</span></div>
            <div class="field"><span class="label">Throughput UDP</span><span class="value" id="m-throughput">--</span></div>
            <div class="field"><span class="label">Pacotes recebidos</span><span class="value" id="m-packets">--</span></div>
            <div class="field"><span class="label">Bytes totais</span><span class="value" id="m-bytes">--</span></div>
        </div>
        <div class="alerts">
            <div id="alerts-container"></div>
        </div>
    </div>

    <script>
        let authToken = null;

        document.getElementById('btn-login').addEventListener('click', async function() {
            const user = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            const msg = document.getElementById('login-msg');
            const resp = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: user, password: pass}),
            });
            if (resp.ok) {
                const data = await resp.json();
                authToken = data.token;
                document.getElementById('login-overlay').style.display = 'none';
                refresh();
                refreshMetrics();
            } else {
                msg.textContent = 'Usuario ou senha incorretos';
            }
        });

        document.getElementById('btn-register').addEventListener('click', function() {
            window.location.href = '/register';
        });

        async function fetchJSON(url) {
            const resp = await fetch(url);
            return resp.json();
        }

        function buildDroneCard(droneId, d) {
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('data-drone-id', droneId);

            const title = document.createElement('h2');
            title.textContent = droneId;
            card.appendChild(title);

            const fields = [
                {key: 'status', label: 'Status'},
                {key: 'lat', label: 'Latitude'},
                {key: 'lon', label: 'Longitude'},
                {key: 'alt', label: 'Altitude'},
                {key: 'speed', label: 'Velocidade'},
                {key: 'battery', label: 'Bateria'},
            ];

            for (const f of fields) {
                const row = document.createElement('div');
                row.className = 'field';
                const lbl = document.createElement('span');
                lbl.className = 'label';
                lbl.textContent = f.label;
                const val = document.createElement('span');
                val.className = 'value';
                val.setAttribute('data-field', f.key);
                row.appendChild(lbl);
                row.appendChild(val);
                card.appendChild(row);
            }

            const cmds = document.createElement('div');
            cmds.className = 'commands';
            ['LAND', 'HOVER', 'RTH'].forEach(function(type) {
                const btn = document.createElement('button');
                btn.className = 'btn btn-' + type.toLowerCase();
                btn.textContent = type;
                btn.addEventListener('click', function() { sendCmd(droneId, type); });
                cmds.appendChild(btn);
            });
            card.appendChild(cmds);

            updateCard(card, d);
            return card;
        }

        function updateCard(card, d) {
            const statusVal = card.querySelector('[data-field="status"]');
            const status = d.status || 'idle';
            statusVal.textContent = status;
            statusVal.className = 'value status-' + status.toLowerCase();

            card.querySelector('[data-field="lat"]').textContent = d.lat.toFixed(4);
            card.querySelector('[data-field="lon"]').textContent = d.lon.toFixed(4);
            card.querySelector('[data-field="alt"]').textContent = d.alt.toFixed(1) + ' m';
            card.querySelector('[data-field="speed"]').textContent = d.speed.toFixed(1) + ' m/s';
            card.querySelector('[data-field="battery"]').textContent = d.battery.toFixed(1) + '%';
        }

        async function sendCmd(droneId, type) {
            const headers = {'Content-Type': 'application/json'};
            if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
            const resp = await fetch('/api/drones/' + encodeURIComponent(droneId) + '/command', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({type: type}),
            });
            const data = await resp.json();
            if (!resp.ok) {
                console.error('Erro:', data.error);
            }
        }

        async function refresh() {
            const {drones} = await fetchJSON('/api/drones');
            const grid = document.getElementById('drone-grid');
            const noDrones = document.getElementById('no-drones');

            if (drones.length === 0) {
                noDrones.style.display = 'block';
                grid.querySelectorAll('[data-drone-id]').forEach(function(el) { el.remove(); });
                return;
            }
            noDrones.style.display = 'none';

            const activeDrones = new Set(drones);
            grid.querySelectorAll('[data-drone-id]').forEach(function(card) {
                if (!activeDrones.has(card.getAttribute('data-drone-id'))) {
                    card.remove();
                }
            });

            for (const id of drones) {
                const data = await fetchJSON('/api/drones/' + encodeURIComponent(id));
                const existing = grid.querySelector('[data-drone-id="' + id + '"]');
                if (existing) {
                    updateCard(existing, data.latest);
                } else {
                    grid.appendChild(buildDroneCard(id, data.latest));
                }
            }

            const {alerts} = await fetchJSON('/api/alerts');
            const ac = document.getElementById('alerts-container');
            while (ac.firstChild) ac.removeChild(ac.firstChild);
            for (const a of alerts) {
                const div = document.createElement('div');
                div.className = 'alert-item';
                div.textContent = a.drone_id + ' - ' + a.alert_type + ': ' + a.message;
                ac.appendChild(div);
            }
        }

        async function refreshMetrics() {
            const data = await fetchJSON('/api/metrics');
            const panel = document.getElementById('metrics-panel');
            if (data.rtt || data.throughput) {
                panel.style.display = 'block';
            }
            if (data.rtt && data.rtt.average_sec !== null) {
                document.getElementById('m-rtt').textContent = (data.rtt.average_sec * 1000).toFixed(2) + ' ms';
            }
            if (data.throughput) {
                document.getElementById('m-throughput').textContent = (data.throughput.bytes_per_second / 1024).toFixed(2) + ' KB/s';
                document.getElementById('m-packets').textContent = data.throughput.packet_count;
                document.getElementById('m-bytes').textContent = data.throughput.total_bytes;
            }
        }

        refresh();
        refreshMetrics();
        setInterval(refresh, 2000);
        setInterval(refreshMetrics, 3000);
    </script>
</body>
</html>
